<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0a14"><title>Player profile · TRS CIS League</title>
<style>
:root{color-scheme:dark;--line:#ffffff1b;--muted:#9692a3;--purple:#9674e2;--green:#39d39d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0,#302047,transparent 38%),radial-gradient(ellipse at 94% 100%,#2a1b38,transparent 35%),#0c0a14;color:#f2f0f7;font:14px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1100px)/2))}.brand{font-weight:900;letter-spacing:.05em}.brand span{color:#b49aff}.navlinks{display:flex;gap:18px;color:#aaa5b6;font-size:11px;font-weight:700}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#ffffff08;color:white;font-size:10px;font-weight:750;cursor:pointer}.wrap{width:min(1060px,calc(100% - 32px));margin:36px auto 75px}.hero{padding:27px;display:flex;align-items:center;gap:17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(105deg,#282039,#17151e 64%,#211825);position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,#a184ec,transparent 75%)}.avatar{width:86px;height:86px;border-radius:18px;object-fit:cover;background:#302a3a;border:1px solid #ffffff20}.ident{flex:1;min-width:0}.small{font-size:11px;color:var(--muted)}h1{font-size:30px;margin:5px 0 3px;line-height:1.2}.handle{font-size:12px;color:#a39eaf}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{border:1px solid #8c6fc866;background:#7355a824;color:#dfd3ff;border-radius:99px;padding:6px 9px;font-size:9px;font-weight:750}.chip.green{border-color:#39d39d4d;background:#39d39d12;color:#7ce5bd}.stats{display:flex;gap:8px}.stat{min-width:90px;border:1px solid var(--line);background:#0f0e15;border-radius:11px;padding:11px 13px}.stat b{font-size:17px;display:block}.stat small{font-size:9px;color:var(--muted)}.tabs{display:flex;gap:5px;padding:6px;border:1px solid var(--line);background:#15141d;border-radius:11px;width:max-content;margin:12px 0 24px;max-width:100%;overflow:auto}.tabs button{white-space:nowrap}.tabs .active{background:#443265;border-color:#443265}.section-title{font-size:17px;margin:0 0 4px}.section-sub{font-size:11px;color:var(--muted);margin:0 0 13px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;align-items:start}.card{background:#17161f;border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{font-size:14px;margin:0 0 6px}.card>p{font-size:10px;line-height:1.6;color:var(--muted);margin:0 0 15px}.account{display:flex;align-items:center;gap:11px;border-top:1px solid var(--line);padding:12px 0}.account img{width:44px;height:44px;border-radius:13px;object-fit:cover;background:#2c2835}.account.roblox img{border-radius:50%}.account b{font-size:11px}.account small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.tag{margin-left:auto;color:var(--green);font-size:9px;font-weight:800}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{border:1px solid var(--line);border-radius:9px;padding:10px;background:#ffffff04}.info small{display:block;font-size:8px;color:var(--muted);margin-bottom:6px}.info b{font-size:10px}.empty{border:1px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--muted);font-size:11px}.notice{border:1px solid #39d39d38;background:#39d39d0d;border-radius:10px;padding:12px;color:#a7dfc9;font-size:10px;line-height:1.6}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{flex-wrap:wrap;padding:20px}.avatar{width:72px;height:72px}.stats{width:100%}.stat{flex:1}.navlinks{gap:9px}}@media(max-width:480px){.nav{padding:0 14px}.navlinks a:nth-child(2){display:none}.wrap{margin-top:20px}.hero{gap:12px}.hero h1{font-size:25px}.tabs{width:100%}}
</style></head><body><header class="nav"><a class="brand" href="/">TRS <span>CIS</span> LEAGUE</a><nav class="navlinks"><a href="/">Home</a><a href="/#members">Players</a><a href="/league.html">League</a><a href="/support.html">Support</a></nav><button id="logout" class="button hidden">Log out</button></header>
<main class="wrap" id="app"><section class="card">Loading player profile...</section></main>
<script>
const app=document.getElementById('app');let record=null,currentTab='Overview';
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(v){return v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}
async function load(){
 try{const u=new URLSearchParams(location.search).get('u');if(u){const r=await fetch('/api/profiles?username='+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error();record=(await r.json()).profile;
 const me=await fetch('/api/verification/status',{credentials:'same-origin',cache:'no-store'}).then(x=>x.json()).catch(()=>({}));if(me.discord&&me.discord.id===record.discord.id)document.getElementById('logout').classList.remove('hidden');
 }else{const me=await fetch('/api/verification/status',{credentials:'same-origin',cache:'no-store'}).then(x=>x.json());if(!me.verified||!me.profile){location.replace('/verify.html');return}record=me.profile;document.getElementById('logout').classList.remove('hidden')}
 document.title=(record.roblox.displayName||record.roblox.username)+' · TRS CIS League';render()
 }catch{app.innerHTML='<section class="card" style="max-width:560px;margin:12vh auto;text-align:center"><h2>Profile not found</h2><p>This player has not completed verification, or this profile link is invalid.</p><a class="button" href="/">Back to players</a></section>'}
}
function render(){
 const d=record.discord,r=record.roblox,verified=date(record.verifiedAt),t=currentTab;
 let content='';
 if(t==='Overview')content='<section class="card"><h2>Player information</h2><p>Account details linked to this TRS CIS League profile.</p><div class="info"><div><small>PROFILE STATUS</small><b style="color:var(--green)">Verified</b></div><div><small>VERIFIED ON</small><b>'+esc(verified)+'</b></div><div><small>ROBLOX USERNAME</small><b>@'+esc(r.username)+'</b></div><div><small>DISCORD</small><b>@'+esc(d.handle||d.username)+'</b></div></div></section><section class="card"><h2>Linked accounts</h2><p>Both accounts were confirmed during verification.</p>'+accountRow('Discord',d.username,d.handle,d.avatar,false)+accountRow('Roblox',r.displayName,r.username,r.avatar,true)+'</section>';
 if(t==='Registration')content='<section class="card"><h2>Registration</h2><p>TRS CIS League account details.</p><div class="info"><div><small>MEMBER SINCE</small><b>'+esc(verified)+'</b></div><div><small>VERIFICATION</small><b>Discord + Roblox</b></div><div><small>ROBLOX ACCOUNT</small><b>'+esc(r.username)+'</b></div><div><small>DISCORD ACCOUNT</small><b>'+esc(d.username)+'</b></div></div></section>';
 if(t==='Achievements')content='<section class="card"><h2>Achievements</h2><p>League achievements for this player.</p><div class="empty">No achievements recorded yet.</div></section>';
 if(t==='Integrations')content='<section class="card"><h2>Connected accounts</h2><p>Verified account integrations.</p>'+accountRow('Discord',d.username,d.handle,d.avatar,false)+accountRow('Roblox',r.displayName,r.username,r.avatar,true)+'</section>';
 app.innerHTML='<section class="hero"><img class="avatar" src="'+esc(r.avatar||d.avatar)+'" alt="Roblox avatar"><div class="ident"><div class="small">Player profile</div><h1>'+esc(r.displayName||r.username)+'</h1><div class="handle">@'+esc(r.username)+'</div><div class="chips"><span class="chip">Discord · '+esc(d.username||d.handle)+'</span><span class="chip">Roblox · '+esc(r.username)+'</span><span class="chip green">Verified</span></div></div><div class="stats"><div class="stat"><b>2/2</b><small>LINKED ACCOUNTS</small></div><div class="stat"><b>✓</b><small>STATUS</small></div></div></section><nav class="tabs">'+['Overview','Registration','Achievements','Integrations'].map(x=>'<button class="button '+(x===t?'active':'')+'" data-tab="'+x+'">'+x+'</button>').join('')+'</nav><h2 class="section-title">'+esc(t)+'</h2><p class="section-sub">TRS CIS League member profile</p><div class="grid">'+content+'</div>';
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()})
}
function accountRow(type,name,handle,avatar,roblox){return '<div class="account '+(roblox?'roblox':'')+'"><img src="'+esc(avatar)+'" alt="'+type+' avatar"><div><b>'+esc(name||handle)+'</b><small>'+(roblox?'<a href="'+esc(record.roblox.profile)+'" target="_blank" rel="noopener">Roblox · @'+esc(handle)+' ↗</a>':'Discord · @'+esc(handle))+'</small></div><span class="tag">CONNECTED</span></div>'}
document.getElementById('logout').onclick=()=>location.assign('/api/logout');load();
</script></body></html>
